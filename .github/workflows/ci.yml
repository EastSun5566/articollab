name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Validate release tag
        id: release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { appendFileSync, readFileSync } from "node:fs";

          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          const tag = process.env.GITHUB_REF_NAME;
          assert.match(tag ?? "", /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-beta\.(0|[1-9]\d*))?$/);
          assert.equal(tag, "v" + manifest.version, "Release tag must match package.json");
          assert.equal(manifest.name, "articollab");
          assert.equal(manifest.private, false);
          const distTag = tag.includes("-beta.") ? "beta" : "latest";
          appendFileSync(process.env.GITHUB_OUTPUT, "dist-tag=" + distTag + "\n");
          NODE

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false

      - name: Report Node.js version
        run: node --version

      - name: Report pnpm version
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Browser JS imports the built entrypoint; type-aware lint needs its declarations.
      # Run root checks before installing example dependencies, matching a fresh checkout.
      - name: Lint
        run: pnpm lint

      - name: Check unused code and dependencies
        run: pnpm knip

      - name: Install text editor example dependencies
        run: pnpm --dir examples/text-editor install --frozen-lockfile --ignore-scripts

      - name: Typecheck text editor example
        run: pnpm --dir examples/text-editor check

      - name: Lint text editor example
        run: pnpm --dir examples/text-editor lint

      - name: Check unused text editor code and dependencies
        run: pnpm --dir examples/text-editor knip

      - name: Test text editor example
        run: pnpm --dir examples/text-editor test

      - name: Check browser smoke JSDoc
        run: pnpm exec tsc --ignoreConfig --allowJs --checkJs --allowImportingTsExtensions --noEmit --strict --target ES2024 --module NodeNext --moduleResolution NodeNext examples/browser-smoke/smoke.js examples/http-sync-controller.js examples/browser-http-smoke/smoke.js examples/browser-reload-recovery/recovery.js

      - name: Test installed package consumer
        run: pnpm test:package

      - name: Stage documentation
        run: pnpm docs:build

      - name: Check documentation
        run: pnpm docs:check

      - name: Upload documentation artifact
        if: vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .docs-site/
          include-hidden-files: true # The validated allowlist includes only .nojekyll as a hidden file.

  # The package supports Node.js 24 (engines >=24); development and release use .nvmrc.
  compat-node24:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false

      - name: Report Node.js version
        run: node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Test installed package consumer
        run: pnpm test:package

  deploy-docs:
    needs: checks
    if: vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages without enabling it
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Deploy validated documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  publish:
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.checks.outputs.dist-tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      NPM_DIST_TAG: ${{ needs.checks.outputs.dist-tag }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up npm for trusted publishing
        run: |
          npm install --global npm@11.21.0 --ignore-scripts
          npm --version

      - name: Build
        run: pnpm build

      - name: Pack release tarball
        id: pack
        run: |
          release_directory=$(mktemp -d "$RUNNER_TEMP/articollab-release.XXXXXX")
          pnpm pack --pack-destination "$release_directory"
          node --input-type=module - "$release_directory" <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { appendFileSync, readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";

          const directory = process.argv[2];
          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          const filename = manifest.name + "-" + manifest.version + ".tgz";
          assert.deepEqual(readdirSync(directory), [filename]);
          const tarball = join(directory, filename);
          const integrity = "sha512-" + createHash("sha512").update(readFileSync(tarball)).digest("base64");
          appendFileSync(process.env.GITHUB_OUTPUT, "tarball=" + tarball + "\nintegrity=" + integrity + "\n");
          NODE

      - name: Dry-run release tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --dry-run --ignore-scripts --tag "$NPM_DIST_TAG" --access public --registry=https://registry.npmjs.org/

      - name: Publish release tarball with OIDC
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --ignore-scripts --tag "$NPM_DIST_TAG" --access public --registry=https://registry.npmjs.org/

      - name: Verify registry version, dist-tag and integrity
        env:
          TARBALL_INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";

          const { name, version } = JSON.parse(readFileSync("package.json", "utf8"));
          // The registry may expose an accepted release later. Retry reads, never publication.
          const maxAttempts = 24;
          for (let attempt = 1; attempt <= maxAttempts; attempt++) {
            let published;
            try {
              published = JSON.parse(execFileSync("npm", [
                "view", name + "@" + version, "--json", "--prefer-online", "--registry=https://registry.npmjs.org/",
              ], { encoding: "utf8", timeout: 15_000, stdio: ["ignore", "pipe", "pipe"] }));
            } catch (error) {
              if (!error.stdout || JSON.parse(error.stdout).error?.code !== "E404") throw error;
            }
            if (published !== undefined) {
              assert.equal(published.version, version);
              assert.equal(published.dist.integrity, process.env.TARBALL_INTEGRITY);
              if (published["dist-tags"][process.env.NPM_DIST_TAG] === version) {
                console.log("Verified " + name + "@" + version + " on " + process.env.NPM_DIST_TAG);
                break;
              }
            }
            if (attempt === maxAttempts) {
              throw new Error("Registry verification timed out after " + maxAttempts + " reads. The publish command completed, but public availability is unconfirmed; inspect npm before retrying anything.");
            }
            console.log("Waiting for registry version and dist-tag (attempt " + attempt + "/" + maxAttempts + ")");
            await new Promise((resolve) => setTimeout(resolve, 15_000));
          }
          NODE
