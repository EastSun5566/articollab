<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>React todo list | Articollab</title>
  <link rel="icon" href="data:,">
  <style>
    :root { font: 16px/1.55 system-ui, sans-serif; color: #1b2938; background: #f7f9fc; }
    body { margin: 0; }
    main { max-width: 70rem; padding: 2rem clamp(1rem, 4vw, 3rem); margin: auto; }
    h1 { font-size: clamp(1.7rem, 3vw, 2.4rem); line-height: 1.2; margin: 0 0 1rem; }
    h2 { margin: 0 0 .75rem; font-size: 1.3rem; }
    header p { max-width: 75ch; }
    .writers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2rem; margin-top: 2rem; }
    .writer { background: white; border: 1px solid #c9d4e0; border-radius: .4rem; padding: 1rem; min-width: 0; }
    input { font: inherit; padding: .3rem .45rem; border: 1px solid #c9d4e0; border-radius: .25rem; }
    button { font: inherit; padding: .3rem .6rem; border: 1px solid #c9d4e0; border-radius: .25rem; background: white; color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid #205faa; outline-offset: 2px; }
    button:disabled { opacity: .55; cursor: default; }
    .list-title { width: 100%; box-sizing: border-box; font-size: 1.1rem; font-weight: 600; }
    .summary, .message { color: #4e6477; font-size: .9rem; }
    .items { list-style: none; margin: 0 0 .75rem; padding: 0; }
    .item { display: flex; gap: .4rem; align-items: center; padding: .25rem 0; }
    .item .title { flex: 1; min-width: 0; }
    .item.done .title { text-decoration: line-through; color: #4e6477; }
    .editing { font-size: .8rem; color: #8a5a00; white-space: nowrap; }
    .add { display: flex; gap: .4rem; }
    .add input { flex: 1; min-width: 0; }
    .controls { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: 1rem; }
    .controls label { display: inline-flex; align-items: center; gap: .35rem; cursor: pointer; }
    .badge { font-size: .8rem; font-weight: 600; vertical-align: middle; padding: .15rem .55rem; border-radius: 999px; background: #e8eef5; }
    .badge[data-state="live"] { color: #1d6b3a; }
    .badge[data-state="syncing"], .badge[data-state="polling"] { color: #205faa; }
    .badge[data-state="offline"] { color: #8a5a00; }
    .badge[data-state="blocked"], .badge[data-state="failed"], .badge[data-state="closed"] { color: #a5232b; }
    @media (max-width: 50rem) { .writers { grid-template-columns: 1fr; } }
  </style>
  <script type="importmap">
    { "imports": {
      "articollab": "/dist/index.js",
      "articollab/sync": "/dist/sync/index.js",
      "articollab/react": "/dist/react.js",
      "articulated": "/vendor/articulated/index.js",
      "sparse-array-rled": "/vendor/sparse-array-rled/index.js",
      "react": "https://esm.sh/react@19.3.1",
      "react-dom/client": "https://esm.sh/react-dom@19.3.1/client?deps=react@19.3.1"
    } }
  </script>
</head>
<body>
  <main>
    <header>
      <h1>Two writers, one React list.</h1>
      <p>Each writer is a React tree over its own sync client. Add, tick and rename items, press 👍 in both at once, and turn a
        writer <strong>Offline</strong> to edit apart: every change comes back, every like counts, and <strong>Undo</strong>
        takes back only your own edits. React loads from esm.sh.</p>
    </header>
    <div id="app"></div>
  </main>
  <script type="module">
    import { mountTodos } from "/react-todo/page.js";
    const page = await mountTodos(document.getElementById("app"), location.origin);
    window.addEventListener("pagehide", () => page.destroy(), { once: true });
  </script>
</body>
</html>
